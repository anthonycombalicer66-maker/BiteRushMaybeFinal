<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../darkmode.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | BiteRush</title>
  <link rel="stylesheet" href="./auth-pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../darkmode.css">
</head>
<body>
  <header class="auth-nav"><a href="index.html" class="auth-logo"><img src="./images/burger.png" alt="">BiteRush</a><span>Account recovery</span></header>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-icon"><i class="fa-solid fa-lock"></i></div>
      <h1>Forgot your password?</h1>
      <p class="auth-intro">No worries. Enter the email address or phone number linked to your BiteRush account and we’ll help you reset it.</p>
      <form id="reset-form">
        <label for="recovery-contact">Email or phone number</label>
        <input id="recovery-contact" type="text" placeholder="you@example.com" autocomplete="email" required>
        <button type="submit" class="auth-primary">Send reset link</button>
      </form>
      <p id="reset-message" class="success-message" role="status" hidden></p>
      <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to log in</a>
    </section>
  </main>
  <script src="./auth.js"></script>
</body>
</html>
