<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../darkmode.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login QR Code</title>

    <link rel="stylesheet" href="style.css">

    <!-- fontawesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../darkmode.css">
</head>
<body>

    <!-- top navigation -->
    <header class="navbar">

        <div class="logo">
            <img src="./images/burger.png" alt="BiteRush logo">
            <h3 class="biterush-title">BiteRush</h3>
        </div>

        <div class="page-title">QR code Login</div>

    </header>


    <!-- main contents -->
    <main class="main">

        <!-- back button -->
        <a href="../Login/index.html" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
        </a>


        <!-- left branding section -->
        <section class="brand-section">

            <img
                src="./images/burger.png"
                alt="BiteRush mascot"
                class="burger-mascot">

            <h1 class="biterush-center">BiteRush</h1>

            <p>Rush your cravings.</p>

        </section>


        <!-- qr login box -->
        <section class="qr-login-box">

            <h2>Log In with QR code</h2>

            <!-- qr code -->
            <div class="qr-code">
                <img
                    src="./images/qrcode.png"
                    alt="BiteRush QR code">
            </div>

            <p class="qr-description">
                Use the scan feature in your BiteRush app.
            </p>

            <p class="qr-instruction">
                Scan with QR code with BiteRush App
            </p>

            <p class="signup-prompt">
                New to BiteRush?
                <a href="../Login/SignUp.html">Sign up</a>
            </p>

        </section>

    </main>

</body>
</html>
