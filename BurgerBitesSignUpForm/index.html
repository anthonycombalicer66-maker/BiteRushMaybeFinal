<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../darkmode.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignUpKulay.css">
    <title>BiteRush SignUp</title>
    <link rel="stylesheet" href="../darkmode.css">
</head>
<body>
    
    <nav>
        <div class="logo-section">
        <img src="Pics/burger.png" alt="" height="400" width="400">
         <h1>BiteRush</h1>
         <span>Sign Up</span>
        </div>

        <ul>
            <li><a href id="Home">Home</a></li>
            <li><a href id="Sign Up">Sign Up</a></li>
            <li><a href id="Log In">Log In</a></li>
        </ul>
    </nav>

     <section class="headSec">
        <h2>Are you ready to sign up to Bite Rush?</h2>
        <p>
            Let us know more about you for a faster and more accurate delivery.
        </p>
     </section>

     <div class="form-cont">

        <h3>User Details</h3>

        <div class="row">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
        </div>

        <div class="row">
            <input type="email" placeholder="Email">
            <input type="text" placeholder="Phone Number +63">
        </div>

        <div class="row">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
        </div>

        <div class="Checkbox-grp">
            <label>
                <input type="checkbox">
                I would like to receive announcements and promotions from BiteRush.
            </label>

            <label>
                <input type="checkbox">
                I consent to the collection and processing of my personal information for BiteRush’s Customer
                Relationship Management. I understand my data privacy rights and can withdraw consent at any time.
            </label>

            <label>
                <input type="checkbox">
                I have read and agree to the Privacy Policy and Terms & Conditions.
            </label>
        </div>

        <button>Create Account</button>

     </div>
</body>
</html>
